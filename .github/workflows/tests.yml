name: tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/P1-P5-donnees-admin]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: ruff check app data tests --output-format=github
