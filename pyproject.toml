[project]
name = "squadra8-prix-agricoles"
version = "0.1.0"
description = "Service téléphonique de prix agricoles pour les producteurs du Zou"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv", "docs"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
